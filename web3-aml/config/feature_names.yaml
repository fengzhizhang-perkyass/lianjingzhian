# Only verified meanings may be added here. Unmapped fields retain raw names.
feature_names:
  num_txs_as_sender: 作为发送方的交易次数
  num_txs_as receiver: 作为接收方的交易次数
  first_block_appeared_in: 首次出现区块
  last_block_appeared_in: 最后出现区块
  lifetime_in_blocks: 生命周期区块数
