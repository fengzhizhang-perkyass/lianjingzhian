  btc_transacted_max: BTC 单次交易最大值
  btc_transacted_mean: BTC 交易量均值
  btc_transacted_median: BTC 交易量中位数
  btc_sent_total: BTC 发送总量
  btc_sent_min: BTC 发送最小值
