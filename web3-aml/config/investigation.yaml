# Lightweight decision layer; base V1.1 risk scores remain independently available.
experiment:
  name: investigation_v1
  source_experiment: risk_v2
  seed: 42
  folds:
    - {name: early_shift, train_end: 22, val_end: 28}
    - {name: late_train, train_end: 28, val_end: 34}
  experts: [graphsage, dual_view, topology_tree]
  weight_step: 0.25
  selection_metric: mean_development_ap
  tree: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31, n_jobs: 4}
  patience: 8
  review_top_k: [100, 500]
  review_fractions: [0.01, 0.05]
  # A separate priority overlay; never reinterpret this as a legal conclusion.
diagnostics:
  high_score: 60
  low_score: 30
  queue_size: 100
  plot_sample_size: 1200
  low_threshold_fraction: 0.5
  uplift_queue_size: 1000
