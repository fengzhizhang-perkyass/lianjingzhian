llm:
  enabled: true
  provider: ${LLM_PROVIDER}
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  temperature: 0.2
  timeout: 60
  max_retries: 0
  max_tokens: 8192
  # Applied only when provider=deepseek; generic providers receive no thinking field.
  thinking_mode: disabled
